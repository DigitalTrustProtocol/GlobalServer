name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # rust-toolchain.toml pins the Windows MSVC toolchain for dev machines;
  # Linux uses the default stable toolchain.
  RUSTUP_TOOLCHAIN: stable

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # librocksdb-sys compiles RocksDB (C++20) with cc and runs bindgen,
      # which loads libclang. No CMake needed.
      - name: native build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ clang libclang-dev
      # `toolchain: stable` is required. Without it this action reads
      # rust-toolchain.toml and tries to install the Windows MSVC toolchain
      # on Linux. RUSTUP_TOOLCHAIN above keeps later cargo calls on Linux stable too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
